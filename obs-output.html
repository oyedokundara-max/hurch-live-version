<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>OBS Program Canvas Output</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050b14;
    }
    .feed-title {
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-transform: uppercase;
    }
    .lower-third {
      position: absolute;
      bottom: 60px;
      left: 60px;
      background: rgba(15, 23, 42, 0.9);
      border-left: 10px solid #f59e0b;
      padding: 20px 40px;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lower-third h3 {
      color: #f59e0b;
      font-size: 1.8rem;
      text-transform: uppercase;
    }
    .lower-third p {
      color: #ffffff;
      font-size: 1.4rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <div id="program-camera-title" class="feed-title">CAMERA 1</div>
    <div id="lower-third-box" class="lower-third" style="display: none;">
      <h3>ANNOUNCEMENT</h3>
      <p id="lower-third-text">---</p>
    </div>
  </div>

  <script>
    const socket = io();
    const titleEl = document.getElementById('program-camera-title');
    const ltBox = document.getElementById('lower-third-box');
    const ltText = document.getElementById('lower-third-text');

    socket.on('state:update', (state) => {
      const liveCamName = state.cameraMap[state.liveCamera] || state.liveCamera.toUpperCase();
      titleEl.textContent = liveCamName;

      if (state.announcement && state.announcement.trim() !== '') {
        ltText.textContent = state.announcement;
        ltBox.style.display = 'block';
      } else {
        ltBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
